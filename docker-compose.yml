services:
  tracker:
    build: .
    image: polymarket-trader-monitor:latest
    container_name: polymarket-tracker
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,time,pathlib; p=pathlib.Path('/app/data/heartbeat'); sys.exit(0 if p.exists() and time.time()-float(p.read_text()) < 90 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
